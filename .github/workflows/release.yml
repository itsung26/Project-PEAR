name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "wix"
          Invoke-WebRequest `
            -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" `
            -OutFile (Join-Path $env:RUNNER_TEMP "wix.zip")
          Expand-Archive (Join-Path $env:RUNNER_TEMP "wix.zip") -DestinationPath $dest
          Add-Content -Path $env:GITHUB_PATH -Value $dest

      - name: Build installer and portable zip
        shell: pwsh
        run: ./scripts/package.ps1 -Version "${{ github.ref_name }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pear-windows
          path: |
            release/PEAR_installer_edition.exe
            release/PEAR_portable_edition.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "${{ github.ref_name }}"
          gh release view $tag
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Project-PEAR $tag" --notes "Windows installer (PEAR_installer_edition.exe) and portable build (PEAR_portable_edition.zip)."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag `
            release/PEAR_installer_edition.exe `
            release/PEAR_portable_edition.zip `
            --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
